[project]
name = "interlockd"
version = "0.1.1"
description = "Interlock daemon: a pre/post-action interlock for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
mandate = ["cedarpy>=4.7,<5"]
strands = ["strands-agents>=1.40"]                       # interlockd.integrations.strands
langchain = ["langchain-core>=1.0"]                      # interlockd.integrations.langchain
openai-agents = ["openai-agents>=0.20"]                  # interlockd.integrations.openai_agents
google-adk = ["google-adk>=2.0"]                         # interlockd.integrations.google_adk
crewai = ["crewai>=1.10"]                                # interlockd.integrations.crewai
claude-agent-sdk = ["claude-agent-sdk>=0.2"]             # interlockd.integrations.claude_agent_sdk
promptguard = ["transformers>=4.44,<6", "torch>=2.3"]   # optional classifier for the local injection probe
dev = ["pytest>=8.3,<10", "moto[dynamodb]>=5.0,<6", "boto3>=1.35,<2", "ruff>=0.6,<1", "cedarpy>=4.7,<5"]

[project.scripts]
interlock = "interlockd.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interlockd"]

[tool.hatch.build.targets.wheel.force-include]
"interlockd/schema/verdict.schema.json" = "interlockd/schema/verdict.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
