name: Bug
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a way past a rule? Please use **private vulnerability reporting** instead (see the link on the previous page).
        Audit records contain tool arguments: remove anything secret before pasting.
  - type: textarea
    id: what
    attributes: { label: "What happened, and what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: "Steps to reproduce" }
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `interlock --version` and `interlock doctor`
      render: text
    validations: { required: true }
  - type: input
    id: agent
    attributes: { label: Agent and version, placeholder: "Claude Code 2.x, Codex 0.x, Cursor CLI ..." }
  - type: input
    id: os
    attributes: { label: OS, placeholder: "macOS 15 arm64, Ubuntu 24.04 ..." }
