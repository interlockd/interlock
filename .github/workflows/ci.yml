name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    # native Windows: daemon, policy, audit, scan, SDKs (agent hooks and the sandbox stay macOS/Linux; WSL2)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" --python .venv/Scripts/python.exe
      - name: Unit tests
        run: .venv/Scripts/python.exe -m pytest -q -p no:cacheprovider
      - name: Rule corpus gate
        run: .venv/Scripts/interlock.exe test
      - name: Live daemon on Windows (start, decide, audit, stop)
        run: |
          export INTERLOCK_HOME="$RUNNER_TEMP/ih" IL=.venv/Scripts/interlock.exe
          $IL enforce && $IL start && $IL status
          .venv/Scripts/python.exe - <<'PY'
          import os
          from interlockd.integrations.client import InterlockClient
          c = InterlockClient()
          cases = [("Bash", {"command": "git push --force origin main"}, "block"),
                   ("Write", {"file_path": os.path.expanduser(r"~\.CLAUDE\settings.json"), "content": "{}"}, "block"),
                   ("Read", {"file_path": "README.md"}, "allow")]
          for tool, args, want in cases:
              v = c.decide("pre_action", tool, args, cwd=os.getcwd())
              print(tool, args, "->", v and v["disposition"])
              assert v and v["disposition"] == want, v
          PY
          $IL audit verify
          $IL stop
          sleep 2
          if curl -sf http://127.0.0.1:7391/interlock/v1/health; then echo "daemon still running after stop"; exit 1; fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Unit tests
        run: .venv/bin/pytest -q
      - name: Rule corpus gate
        run: .venv/bin/interlock test
      - name: Evaluation corpus gate
        run: .venv/bin/interlock test --corpus corpus/archetypes
      - name: Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bubblewrap needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          .venv/bin/pytest -q tests/test_sandbox.py -rs
      - name: Framework integrations against a real daemon
        run: |
          uv pip install --python .venv/bin/python strands-agents langchain-core openai-agents google-adk claude-agent-sdk semantic-kernel
          .venv/bin/pytest -q tests/test_strands.py tests/test_langchain.py tests/test_openai_agents.py tests/test_google_adk.py tests/test_claude_agent_sdk.py tests/test_semantic_kernel.py
      - name: CrewAI integration (own environment)
        run: |
          uv venv /tmp/crewai --python 3.12
          uv pip install --python /tmp/crewai/bin/python -e ".[dev]" crewai
          /tmp/crewai/bin/pytest -q tests/test_crewai.py
      - name: Wheel smoke test
        run: |
          uv build --wheel -o dist
          uv venv /tmp/wheel --python 3.12
          uv pip install --python /tmp/wheel/bin/python dist/*.whl
          cd /tmp && /tmp/wheel/bin/interlock test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plant a risky MCP config to prove the scan sees it
        run: |
          mkdir -p .vscode
          echo '{"servers":{"sh":{"command":"bash","args":["-c","node s.js"]}}}' > .vscode/mcp.json
      - uses: ./
        with: { fail-on: never, test-policy: "true" }
      - name: SARIF has the finding
        run: python3 -c "import json;r=json.load(open('interlock.sarif'))['runs'][0]['results'];print(len(r),'results');assert any(x['ruleId']=='mcp.inline_shell' for x in r)"
