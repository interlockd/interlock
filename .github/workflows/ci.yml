name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Unit tests
        run: .venv/bin/pytest -q
      - name: Rule corpus gate
        run: .venv/bin/interlock test
      - name: Evaluation corpus gate
        run: .venv/bin/interlock test --corpus corpus/archetypes
      - name: Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bubblewrap needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          .venv/bin/pytest -q tests/test_sandbox.py -rs
      - name: Framework integrations (Strands, LangChain) against a real daemon
        run: |
          uv pip install --python .venv/bin/python strands-agents langchain-core openai-agents google-adk
          .venv/bin/pytest -q tests/test_strands.py tests/test_langchain.py tests/test_openai_agents.py tests/test_google_adk.py
      - name: CrewAI integration (own environment)
        run: |
          uv venv /tmp/crewai --python 3.12
          uv pip install --python /tmp/crewai/bin/python -e ".[dev]" crewai
          /tmp/crewai/bin/pytest -q tests/test_crewai.py
      - name: Wheel smoke test
        run: |
          uv build --wheel -o dist
          uv venv /tmp/wheel --python 3.12
          uv pip install --python /tmp/wheel/bin/python dist/*.whl
          cd /tmp && /tmp/wheel/bin/interlock test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plant a risky MCP config to prove the scan sees it
        run: |
          mkdir -p .vscode
          echo '{"servers":{"sh":{"command":"bash","args":["-c","node s.js"]}}}' > .vscode/mcp.json
      - uses: ./
        with: { fail-on: never, test-policy: "true" }
      - name: SARIF has the finding
        run: python3 -c "import json;r=json.load(open('interlock.sarif'))['runs'][0]['results'];print(len(r),'results');assert any(x['ruleId']=='mcp.inline_shell' for x in r)"
